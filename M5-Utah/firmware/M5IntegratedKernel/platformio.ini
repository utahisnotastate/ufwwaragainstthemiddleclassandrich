; M5IntegratedKernel — Lazarus Receiver for Utah Flux JIT deployment
; Build once, flash via omni_flash.py, then inject manifests via studio.py

[platformio]
default_envs = cores3
src_dir = src
include_dir = include
lib_dir = lib

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@^0.2.2
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
upload_speed = 460800

[env:cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
build_flags =
    ${env.build_flags}
    -DFLUX_BOARD_CORES3

[env:core2]
platform = espressif32@6.9.0
board = m5stack-core2
build_flags =
    ${env.build_flags}
    -DFLUX_BOARD_CORE2

[env:atoms3]
platform = espressif32@6.9.0
board = m5stack-atoms3
build_flags =
    ${env.build_flags}
    -DFLUX_BOARD_ATOMS3
